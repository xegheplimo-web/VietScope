name: Feature Request
description: Propose a capability for VietScope / Search-Hub
title: "[feat]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? Who does it affect?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Endpoint shape, config knob, pipeline stage — be concrete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This touches provider integration (SearXNG / Firecrawl / code search)
        - label: This changes a public API contract (docs/api/*)
        - label: This needs new secrets or env vars
