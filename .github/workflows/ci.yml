name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test search-router
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: search-router
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false  # submodules are only used for the docker-compose stack, not tests
      - name: Install uv (version pinned via required-version in pyproject.toml)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: search-router/pyproject.toml
          enable-cache: true
          cache-dependency-glob: search-router/uv.lock
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps from lockfile
        run: uv sync --locked
      - name: Run test suite
        run: uv run pytest tests/ -q
      - name: Upload coverage artifact (if any)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-output
          path: search-router/**/pytest*.*
          if-no-files-found: ignore

  docker-build:
    name: Build + scan search-router image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
      # The search-router image layers torch + CUDA 13 (~several GiB). On a
      # fresh ubuntu-latest runner the base image already consumes most of the
      # ~14-20 GB partition; the build then exhausts the disk, the actions-
      # runner worker crashes (check-run annotation: "No space left on device"),
      # the build step is stranded in_progress and job logs are lost. Reclaim
      # the same headroom e2e.yml frees before building.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af || true
          df -h /
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # GHCR rejects uppercase in repository names ("VietScope" → invalid
      # tag), so lowercase the repo slug once and reuse it everywhere.
      - name: Compute lowercase image ref
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/search-router:ci" >> "$GITHUB_OUTPUT"
      - name: Build image (no push — GHCR org package creation is not enabled)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./search-router
          file: ./search-router/Dockerfile
          push: false
          load: true    # materialise the image so Trivy can scan it
          tags: ${{ steps.image.outputs.ref }}
          # type=gha,mode=max exports every layer to the GitHub Actions cache,
          # adding disk staging on top of the already-heavy torch+CUDA build.
          # type=inline caches in the image config instead — no external cache
          # and no full-layer disk staging — leaving the Trivy scan + SPDX SBOM
          # steps below unchanged.
          cache-from: type=inline
          cache-to: type=inline,mode=max
      - name: "Trivy image scan (measure-first)"
        # Reports HIGH/CRITICAL fixable vulns on the built image. Flip
        # exit-code to '1' after the first baseline scan is triaged.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: "Image SBOM (SPDX) artifact"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: spdx-json
          output: image-sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-sbom-${{ github.sha }}
          path: image-sbom.spdx.json
          if-no-files-found: ignore
