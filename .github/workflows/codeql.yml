# CodeQL — deep SAST for the first-party Python tree.
# Results land in the repo's Security → Code scanning tab (SARIF upload).
name: codeql

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '42 4 * * 1'   # weekly deep scan
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false

      # SARIF upload hard-fails while code scanning is off (private repo
      # without Advanced Security). Probe the settings endpoint so the job
      # stays green in that state and resumes automatically once enabled —
      # `security-events: write` makes this endpoint readable when scanning
      # is on and 403 when it is off.
      - name: Detect code-scanning availability
        id: codeql
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/code-scanning/analyses?per_page=1" --silent 2>/dev/null \
            || gh api "repos/$GITHUB_REPOSITORY/code-scanning/default-setup" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Code scanning is not enabled for this repository — skipping CodeQL. Enable it under Settings → Code security (Advanced Security) to restore scanning."
          fi

      - name: Initialize CodeQL
        if: steps.codeql.outputs.enabled == 'true'
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: python
          # Only the first-party tree — vendor submodules are upstream code.
          paths: |
            search-router
          paths-ignore: |
            search-router/tests
            search-router/eval
          queries: security-and-quality

      - name: Perform CodeQL analysis
        if: steps.codeql.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: "/language:python"
