# git-cliff — changelog generation from Conventional Commits.
# Install: cargo install git-cliff (or: winget install git-cliff)
# Usage:   git cliff -o CHANGELOG.md            (full history)
#          git cliff --unreleased -o CHANGELOG.md
[changelog]
header = """
# Changelog

All notable changes to VietScope / Search-Hub are documented here.
Generated by [git-cliff](https://git-cliff.org) from Conventional Commits.
"""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/xegheplimo-web/VietScope/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^security", group = "Security" },
    { message = "^deps|^dependabot", group = "Dependencies" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^ci|^build", group = "CI & Build" },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^revert", group = "Reverts" },
    { body = ".*security", group = "Security" },
]
