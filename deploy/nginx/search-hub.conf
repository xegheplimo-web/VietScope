# Search-Hub public API — reverse proxy scaffold (P10).
# Internet → Cloudflare → this Nginx → search-router:8888
#
# Install: copy to /etc/nginx/conf.d/search-hub.conf (or sites-available),
# set TLS via certbot/Cloudflare Origin cert, then `nginx -t && reload`.
#
# Never proxy 9200/9600/6333/6334/8891/8892 — those stay loopback-only.

upstream search_router {
    # If Nginx runs on the same Docker host:
    server 127.0.0.1:8888;
    keepalive 32;
}

# Rate-limit zone: $binary_remote_addr, 10r/s per IP burst 20 — app-level
# per-key limits still apply inside search-router.
limit_req_zone $binary_remote_addr zone=sh_api:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name search.duyai.app;

    # ssl_certificate     /etc/letsencrypt/live/search.duyai.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/search.duyai.app/privkey.pem;

    # Cloudflare real-IP restore (optional but recommended for quota):
    # include /etc/nginx/cloudflare-real-ip.conf;
    # real_ip_header CF-Connecting-IP;

    client_max_body_size 2m;

    # Public API surface — only /v1/* is exposed.
    location /v1/ {
        limit_req zone=sh_api burst=20 nodelay;

        proxy_pass http://search_router;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # SSE (stream=true on /v1/answer, /v1/research/stream).
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Legacy tool endpoints — restrict to internal callers. Uncomment only
    # if a trusted network/VPN should reach them; otherwise deny.
    location / {
        return 404;
    }
}
