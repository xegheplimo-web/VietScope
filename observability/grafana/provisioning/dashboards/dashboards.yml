apiVersion: 1
providers:
  - name: search-hub
    orgId: 1
    folder: "Search-Hub"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # The provisioning tree is mounted at /etc/grafana/provisioning (see
      # docker-compose.yml), so dashboard JSON ships inside it.
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
