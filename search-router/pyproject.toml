# search-router — VietScope Search Router (FastAPI orchestrator).
#
# Dependency truth lives here; `uv.lock` is the pinned+hashed artifact CI and
# Docker consume. `requirements.txt` is GENERATED (`uv export`) for host-side
# installs (MCP server, pip-audit) — do not hand-edit, run:
#   uv export --frozen --no-dev --format requirements-txt -o requirements.txt
[project]
name = "search-router"
version = "3.0.0"
description = "VietScope Search Router — orchestrates SearXNG, Firecrawl, and code search"
# CI + Docker + pyright all target 3.12 — stay off 3.14 until it's the tested target.
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "redis>=5.0",
    "ddgs>=9.14.0",
    # AI Search pipeline
    "sentence-transformers>=2.7.0",
    "transformers>=4.40.0",
    "torch>=2.1.0",
    # Pin mdurl to avoid hash mismatch (transitive dep of markdown-it-py)
    "mdurl==0.1.2",
    # OpenSearch client — pinned for reproducible builds
    "opensearch-py==3.2.0",
    # hub-postgres driver — async, no ORM
    "asyncpg>=0.30.0",
    # HTML main-content extraction (crawler snapshot → clean text)
    "trafilatura>=2.0",
    # Operational metrics; exposition is disabled only when the endpoint is not used.
    "prometheus-client>=0.21.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
]

[project.optional-dependencies]
# MCP adapter (adapters/mcp_server.py) — optional surface, the core
# router never imports it. Install: `uv sync --extra mcp` or
# `pip install search-router[mcp]` / `pip install mcp` on the host.
mcp = ["mcp>=1.0"]
# P15.1 production OSM backend (ingestion/adapters/osm_osmium.py) —
# optional; the stdlib PBF reader is the fallback. Install:
# `uv sync --extra osmium` / `pip install search-router[osmium]`.
osmium = ["osmium>=3.7"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "diff-cover>=9.0",
    "ruff==0.16.7",
    "pyright>=1.1.390",
    # Exercised by tests/test_p11_mcp.py — the adapter itself is optional.
    "mcp>=1.0",
]

[tool.coverage.run]
# tests/e2e/* are live-stack tests that skip without E2E=1 — they can never
# be covered by the unit job, so they are excluded from measurement.
omit = ["tests/e2e/*"]

[tool.uv]
# Deps-only project: the app is run from source (uvicorn main:app), never
# built as a wheel. No [build-system] on purpose.
package = false
# Pin the uv toolchain itself — astral-sh/setup-uv reads this via version-file
# so local and CI run the identical uv build.
required-version = "==0.12.18"
# Supply-chain gate (quality-gates.yml → dependency_min_release_age_days):
# `uv lock`/`uv add` will not resolve packages released within the last 7
# days. Dependabot `cooldown` mirrors this for update PRs.
exclude-newer = "7 days"
